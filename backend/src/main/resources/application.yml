spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: music-os-api
  datasource:
    url: jdbc:h2:file:./data/music-os;AUTO_SERVER=TRUE
    username: music_os
    password:
  sql:
    init:
      mode: always
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

server:
  address: 127.0.0.1
  port: ${MUSIC_OS_API_PORT:8081}
  error:
    include-message: never

logging:
  level:
    org.hibernate.SQL: warn

music-os:
  data-dir: ${MUSIC_OS_DATA_DIR:${user.home}/.music-os}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
